
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book Info</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

<div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold text-center mb-6">📖 Book Information</h2>

    <div class="space-y-3">
        <div><span class="font-semibold">Name:</span> <span th:text="${book.bookName}"></span></div>
        <div><span class="font-semibold">Description:</span> <span th:text="${book.description}"></span></div>
        <div><span class="font-semibold">Category:</span> <span th:text="${book.catName}"></span></div>
        <div><span class="font-semibold">Author:</span> <span th:text="${book.authorName}"></span></div>
        <div><span class="font-semibold">Release Year:</span> <span th:text="${book.releaseYear}"></span></div>
        <div><span class="font-semibold">Price:</span> <span th:text="${book.price}"></span></div>
        <div><span class="font-semibold">Stock:</span> <span th:text="${book.stock}"></span></div>
        <div><span class="font-semibold">Status:</span> <span th:text="${book.bookStatus}"></span></div>
    </div>

    <div class="text-center mt-6">
        <a href="/book/form"
           class="inline-block bg-blue-500 text-white font-semibold py-2 px-6 rounded-lg shadow-md hover:bg-blue-600 transition">
            Add Another Book
        </a>
    </div>
</div>

</body>
</html>
