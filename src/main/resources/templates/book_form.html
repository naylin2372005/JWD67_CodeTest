


<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Book</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

<div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold text-center mb-6">📚 Add New Book</h2>

    <form th:action="@{/book/save}" th:object="${book}" method="post" class="space-y-4">

        <!-- Error Message -->
        <p th:if="${error}" class="text-red-500 font-medium text-center" th:text="${error}"></p>

        <!-- Book Name -->
        <div>
            <label class="block font-medium text-gray-700">Book Name</label>
            <input type="text" th:field="*{bookName}" required
                   class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
        </div>

        <!-- Description -->
        <div>
            <label class="block font-medium text-gray-700">Description</label>
            <input type="text" th:field="*{description}" required
                   class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
        </div>

        <!-- Release Year -->
        <div>
            <label class="block font-medium text-gray-700">Release Year</label>
            <select th:field="*{releaseYear}" required
                    class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
                <option value="">Select Year</option>
                <option th:each="y : ${years}" th:value="${y}" th:text="${y}"></option>
            </select>
        </div>

        <!-- Price -->
        <div>
            <label class="block font-medium text-gray-700">Price</label>
            <input type="number" step="0.01" min="1" required th:field="*{price}"
                   class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
        </div>

        <!-- Stock -->
        <div>
            <label class="block font-medium text-gray-700">Stock</label>
            <input type="number" min="1" required th:field="*{stock}"
                   class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
        </div>

        <!-- Author -->
        <div>
            <label class="block font-medium text-gray-700">Author</label>
            <select th:field="*{authorId}" required
                    class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
                <option value="0">Select Author</option>
                <option th:each="a : ${authors}" th:value="${a.id}" th:text="${a.author_name}"></option>
            </select>
        </div>

        <!-- Category -->
        <div>
            <label class="block font-medium text-gray-700">Category</label>
            <select th:field="*{categoryId}" required
                    class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
                <option value="0">Select Category</option>
                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.cat_name}"></option>
            </select>
        </div>

        <!-- Submit Button -->
        <div class="text-center">
            <button type="submit"
                    class="mt-4 w-full bg-blue-500 text-white font-semibold py-2 px-6 rounded-lg shadow-md hover:bg-blue-600 transition">
                Add Book
            </button>
        </div>
    </form>
</div>

</body>
</html>
